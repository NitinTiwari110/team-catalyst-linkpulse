spring.application.name=linkpulse

# Server
server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://mysql-3763914b-team-catalyst-linkpulse.l.aivencloud.com:10411/defaultdb?sslMode=REQUIRED
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# App Base URL
app.base-url=${APP_BASE_URL:https://team-catalyst-linkpulse.vercel.app}

# JWT
jwt.secret=${JWT_SECRET}

# Disable default in-memory user configuration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
