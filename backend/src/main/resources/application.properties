spring.application.name=linkpulse
# Server Port (matches our frontend NEXT_PUBLIC_API_BASE_URL)
server.port=8080

# MySQL Database Configuration (Auto-creates linkpulse_db if it does not exist)
spring.datasource.url=jdbc:mysql://mysql-3763914b-team-catalyst-linkpulse.l.aivencloud.com:10411/defaultdb?sslMode=REQUIRED
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# App Base URL (used to generate full short link URLs)
app.base-url=${APP_BASE_URL:https://team-catalyst-linkpulse.vercel.app}

# Disable Spring Security default in-memory user & generated password
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration