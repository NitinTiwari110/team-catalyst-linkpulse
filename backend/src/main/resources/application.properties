spring.application.name=linkpulse
# Server Port (matches our frontend NEXT_PUBLIC_API_BASE_URL)
server.port=8080

# MySQL Database Configuration (Auto-creates linkpulse_db if it does not exist)
spring.datasource.url=jdbc:mysql://localhost:3306/linkpulse_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Mandeep#321
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# App Base URL (used to generate full short link URLs)
app.base-url=http://localhost:8080
